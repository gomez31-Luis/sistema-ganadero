spring.application.name=sistema-ganadero
server.port=8085

# Configuración de Base de Datos
spring.data.mongodb.uri=mongodb://localhost:27017/sistema-ganadero

# Configuracion de subida de archivos (imagenes pesadas)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB



# Sesion: expirar en servidor despues de 5 minutos de inactividad
server.servlet.session.timeout=3m

# Configuracion de Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Clave para firmar cookies "Recordarme" (definir REMEMBER_ME_KEY en produccion)
app.security.remember-me-key=${REMEMBER_ME_KEY:dev-only-change-me}
