<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer Contraseña | Rancho La Bendición</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #1a2e1a 0%, #0f1f0f 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .container {
        width: 100%;
        max-width: 400px;
        padding: 20px;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      }
      .header {
        text-align: center;
        margin-bottom: 25px;
      }
      .header h1 {
        color: #fff;
        font-size: 1.8rem;
        margin-bottom: 10px;
      }
      .header p {
        color: #aaa;
        font-size: 0.9rem;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        color: #ddd;
        margin-bottom: 8px;
        font-size: 0.9rem;
      }
      .input-container {
        position: relative;
      }
      .input-container i {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #4caf50;
      }
      .input-container i.toggle-password {
        left: auto;
        right: 12px;
        cursor: pointer;
        color: #aaa;
        transition: 0.3s;
      }
      .input-container i.toggle-password:hover {
        color: #4caf50;
      }
      input {
        width: 100%;
        padding: 12px 12px 12px 40px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #fff;
        outline: none;
        box-sizing: border-box;
      }
      input:focus {
        border-color: #4caf50;
      }
      .btn {
        width: 100%;
        padding: 12px;
        background: #4caf50;
        border: none;
        border-radius: 8px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn:hover {
        background: #45a049;
      }
      #message {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
      }
      .success {
        color: #4caf50;
      }
      .error {
        color: #f44336;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header">
          <h1>Nueva Contraseña</h1>
          <p>Ingrese su nueva clave de acceso</p>
        </div>
        <form id="resetForm">
          <div class="form-group">
            <label>Nueva Contraseña</label>
            <div class="input-container">
              <i class="fas fa-lock"></i>
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                required
                style="padding-right: 40px"
              />
              <i class="fas fa-eye toggle-password" id="togglePass1"></i>
            </div>
          </div>
          <div class="form-group">
            <label>Confirmar Contraseña</label>
            <div class="input-container">
              <i class="fas fa-check-double"></i>
              <input
                type="password"
                id="confirmPassword"
                placeholder="••••••••"
                required
                style="padding-right: 40px"
              />
              <i class="fas fa-eye toggle-password" id="togglePass2"></i>
            </div>
          </div>
          <button type="submit" class="btn" id="btnSubmit">Actualizar Contraseña</button>
        </form>
        <div id="passwordMatchMessage" style="font-size: 0.85rem; margin-top: 15px; text-align: center; display: none;"></div>
        <div id="message"></div>
      </div>
    </div>
    <script src="js/restablecer.js"></script>
  </body>
</html>
