<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Ganadero | Registro Reproductivo</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="menu-page">
    <header class="menu-header">
      <div class="logo">Rancho la Bendición<span> A LA VANGUARDIA</span></div>
      <nav class="nav-breadcrumb">
        <a href="menu.html">Menú</a> / <span>Registro Reproductivo</span>
      </nav>
      <div class="user-info">
        <div class="dropdown">
          <button class="dropdown-btn">
            <i class="fas fa-list"></i> Ver Registros
            <i class="fas fa-chevron-down" style="font-size: 0.7rem"></i>
          </button>
          <div class="dropdown-content">
            <a href="ver-individual.html"
              ><i class="fas fa-cow"></i> Lista Individual</a
            >
            <a href="ver-reproductivo.html"
              ><i class="fas fa-dna"></i> Lista Reproductiva</a
            >
            <a href="ver-partos.html">
              <span style="display: inline-flex; align-items: flex-end">
                <i class="fas fa-cow"></i
                ><i
                  class="fas fa-cow"
                  style="font-size: 0.6em; margin-left: 2px"
                ></i>
              </span>
              Lista de Partos
            </a>
            <a href="ver-becerros.html"><i class="fas fa-horse-head"></i> Lista de Becerros</a>
            <a href="ver-toros.html"><i class="fas fa-bullseye"></i> Lista de Toros</a>
          </div>
        </div>
        <a href="menu.html" class="btn-back"
          ><i class="fas fa-arrow-left"></i> Volver</a
        >
      </div>
    </header>

    <main class="form-container">
      <div class="form-card">
        <div class="form-header">
          <i class="fas fa-dna"></i>
          <h2>Control Reproductivo</h2>
          <p>Registro de ciclos, inseminaciones y seguimiento de preñez.</p>
        </div>

        <form action="/reproduccion/guardar" method="POST" class="main-form">
          <div class="form-row">
            <div class="form-group">
              <label for="idVaca">ID animal (Carabana)</label>
              <div class="input-with-icon">
                <i class="fas fa-search search-icon-inside"></i>
                <input
                  type="text"
                  id="idVaca"
                  name="idVaca"
                  placeholder="Escriba ID o Nombre para buscar..."
                  required
                  autocomplete="off"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="nombreVaca">Nombre del animal</label>
              <input
                type="text"
                id="nombreVaca"
                name="nombreVaca"
                placeholder="Ej: Estrella"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="fechaCelo">Fecha de Celo</label>
              <input type="date" id="fechaCelo" name="fechaCelo" />
            </div>
            <div class="form-group">
              <label for="fechaInseminacion">Fecha de Inseminación</label>
              <input
                type="date"
                id="fechaInseminacion"
                name="fechaInseminacion"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="toroSemen">Toro / Semen (ID/Nombre)</label>
              <input
                type="text"
                id="toroSemen"
                name="toroSemen"
                placeholder="Ej: Toro Campeón 502"
              />
            </div>
            <div class="form-group">
              <label for="fechaParto" style="color: #e74c3c; font-weight: 700">
                <i class="fas fa-calendar-check"></i> Fecha de Parto (Prevista)
                <span style="font-size: 0.75rem">⚠ Importante</span>
              </label>
              <input
                type="date"
                id="fechaParto"
                name="fechaParto"
                style="
                  border: 2px solid #e74c3c;
                  color: #e74c3c;
                  font-weight: 600;
                "
              />
            </div>
          </div>

          <div class="form-actions">
            <button type="reset" class="btn-secondary">Limpiar</button>
            <button type="submit" class="btn-primary">Guardar Registro</button>
          </div>
        </form>
      </div>
    </main>

    <!-- Notificación Toast -->
    <div id="toastNotification" class="toast">
      <button class="toast-close" onclick="this.parentElement.classList.remove('active')">&times;</button>
      <div class="toast-content">
        <i class="fas fa-check-circle"></i>
        <div class="toast-message">
          <span class="toast-title">¡Éxito!</span>
          <span class="toast-text">Registro reproductivo guardado con éxito.</span>
        </div>
      </div>
      <div class="toast-progress"></div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/reproduccion.js"></script>
    <script src="js/registro_reproductivo.js"></script>
      <script src="js/session_timeout.js"></script></body>
</html>
